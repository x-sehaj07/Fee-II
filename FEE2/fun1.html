<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 4:59 PM Panic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .meme-frame {
            width: 90vw;
            max-width: 480px;
            background: #fff;
            border: 8px solid #000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 15px 15px 0px #ff4757;
        }

        .caption {
            color: #000;
            font-size: 2rem;
            text-transform: uppercase;
            text-align: center;
            padding: 20px;
            line-height: 1.2;
            letter-spacing: 1px;
            background: #fff;
        }

        .animation-sandbox {
            height: 280px;
            background: #f1f2f6;
            position: relative;
            border-top: 6px solid #000;
            border-bottom: 6px solid #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Peaceful Employee Clocking Out */
        .employee-clock {
            font-size: 4rem;
            animation: chillOut 2s infinite alternate ease-in-out;
            z-index: 1;
        }

        /* The Aggressive Incoming Message */
        .slack-attack {
            position: absolute;
            right: -350px; /* Starts hidden off-screen */
            width: 300px;
            background: #4a154b; /* Slack Purple */
            color: white;
            padding: 15px;
            border: 4px solid #000;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 5px 5px 0px #000;
            animation: jumpScare 4s infinite cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
        }

        .slack-header {
            font-weight: bold;
            font-size: 0.85rem;
            color: #e0a6e1;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .slack-body {
            font-size: 1rem;
            font-weight: bold;
        }

        /* Animations */
        @keyframes chillOut {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1.05) rotate(5deg); }
        }

        @keyframes jumpScare {
            0%, 20% { 
                right: -350px; 
                transform: rotate(0deg);
            }
            30% { 
                right: 20px; 
                transform: rotate(-5deg); /* Slams onto screen */
            }
            35% {
                transform: rotate(5deg);
            }
            40% {
                transform: rotate(-3deg);
            }
            45%, 85% { 
                right: 20px; 
                transform: rotate(0deg); /* Sits there menacingly */
            }
            95%, 100% { 
                right: -350px; /* Leaves */
            }
        }
    </style>
</head>
<body>

    <div class="meme-frame">
        <!-- Top Caption -->
        <div class="caption">Me at 4:59 PM getting ready to close my laptop</div>

        <!-- Animated Arena -->
        <div class="animation-sandbox">
            <!-- Peacefully leaving -->
            <div class="employee-clock">🏃‍♂️💨</div>

            <!-- The sudden corporate jump scare -->
            <div class="slack-attack">
                <div class="slack-header">
                    <span>💬 BOSS (Active)</span>
                    <span>4:59 PM</span>
                </div>
                <div class="slack-body">"Hey, do you have 5 minutes for a quick call before you log off?"</div>
            </div>
        </div>

        <!-- Bottom Caption -->
        <div class="caption" style="background: #fafafa;">And just like that, my weekend vanished</div>
    </div>

</body>
</html>
