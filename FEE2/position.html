<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
  position: absolute;
  width: 300px;
  height: 200px;
  border: 2px solid black;
}
/* if parent is not given any position then child will take body as its parent if given patent position=absolute then child will move acc to parent */
.child {
  position: relative;
  top: 250px;
  left: 30px;
  background: orange;
}
    </style>
</head>
<body>
    <div class="parent">
  Parent
  <div class="child">Child</div>
</div>
</body>
</html>
